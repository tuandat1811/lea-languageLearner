<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lea – Học ngoại ngữ mỗi ngày</title>
  <meta name="description" content="Học tiếng Anh từ con số 0 với đủ 4 kỹ năng Nghe – Nói – Đọc – Viết." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a light flash in dark mode.
    try { var s = JSON.parse(localStorage.getItem('lea.v1') || '{}').settings; if (s && s.theme) document.documentElement.setAttribute('data-theme', s.theme); } catch (e) {}
  </script>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="logo"><span class="logo-icon" aria-hidden="true"></span><span class="logo-text">Lea</span></a>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="home">Trang chủ</a>
        <a href="#/course" data-nav="course">Lộ trình</a>
        <a href="#/syllabus" data-nav="syllabus">Giáo trình</a>
        <a href="#/pronunciation" data-nav="pronunciation">Phát âm</a>
        <a href="#/review" data-nav="review">Ôn tập</a>
        <a href="#/alphabet" data-nav="alphabet">Bảng chữ cái</a>
        <a href="#/settings" data-nav="settings">Cài đặt</a>
      </nav>
      <div class="stats" id="stats"></div>
      <div class="header-tools">
        <button class="icon-btn" id="rain-btn" type="button" aria-label="Hiệu ứng mưa" aria-pressed="false">🌧</button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Đổi chế độ sáng/tối" aria-pressed="false">☾</button>
      </div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Lea · Học ngoại ngữ mỗi ngày một chút</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Core -->
  <script src="js/core/registry.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/speech.js"></script>
  <script src="js/core/exercises.js"></script>
  <!-- Courses: add new languages here (data/<code>.js) -->
  <script src="data/en.js"></script>
  <script src="data/en-a2.js"></script>
  <script src="data/en-b1.js"></script>
  <script src="data/en-b2.js"></script>
  <script src="data/en-pron.js"></script>
  <!-- UI -->
  <script src="js/ui/rain.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
